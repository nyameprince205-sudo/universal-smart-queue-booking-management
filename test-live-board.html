<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Live Queue Board — Test Viewer</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; }
    input, button { font-size: 16px; padding: 8px; margin-right: 8px; }
    #status { color: #666; margin: 12px 0; }
    #tickets { list-style: none; padding: 0; }
    #tickets li { padding: 12px; margin-bottom: 8px; border-radius: 6px; border: 1px solid #ddd; }
    .waiting { background: #fff8e1; }
    .called { background: #e3f2fd; }
    .serving { background: #e8f5e9; }
    #log { font-size: 12px; color: #888; margin-top: 24px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>Live Queue Board — Test Viewer</h2>
  <p>Enter a branch ID and connect, then run check-in / call-next / etc. from
     Postman or PowerShell in another window — this page updates itself,
     nothing to refresh.</p>

  <input id="branchId" placeholder="Branch ID (e.g. 1)" />
  <button onclick="connect()">Connect</button>

  <div id="status">Not connected</div>
  <ul id="tickets"></ul>
  <div id="log"></div>

  <script>
    let socket;
    function connect() {
      const branchId = document.getElementById("branchId").value;
      if (!branchId) return alert("Enter a branch ID first");

      if (socket) socket.disconnect();
      socket = io("http://localhost:4000");

      socket.on("connect", () => {
        document.getElementById("status").textContent = "Connected — watching branch " + branchId;
        socket.emit("join-branch-queue", branchId);
        log("Connected, joined branch:" + branchId);
      });

      socket.on("queue:update", (board) => {
        log("queue:update received — " + board.length + " ticket(s)");
        renderBoard(board);
      });

      socket.on("disconnect", () => {
        document.getElementById("status").textContent = "Disconnected";
      });
    }

    function renderBoard(board) {
      const list = document.getElementById("tickets");
      list.innerHTML = "";
      if (board.length === 0) {
        list.innerHTML = "<li>No active tickets</li>";
        return;
      }
      board.forEach((t) => {
        const li = document.createElement("li");
        li.className = t.status;
        li.textContent = `${t.ticketNumber} — ${t.status} — ${t.customer?.name || "?"} (${t.service?.name || "?"})`;
        list.appendChild(li);
      });
    }

    function log(msg) {
      const el = document.getElementById("log");
      el.textContent = new Date().toLocaleTimeString() + " — " + msg + "\n" + el.textContent;
    }
  </script>
</body>
</html>
